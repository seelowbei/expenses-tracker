<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Expense Tracker architecture: browser, one Cloudflare Worker with fetch, queue and scheduled handlers, Workers AI, D1 and Google Drive</title>
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11px; }
    .tag { fill: #c2570c; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
    .zl { font-size: 12px; font-weight: 700; letter-spacing: .5px; }
    .cfz { fill: #fff8f1; stroke: #f6821f; }
    .cfl { fill: #c2570c; }
    .gz { fill: #f3f8ff; stroke: #4285f4; }
    .gl { fill: #1a5fd0; }
    .h { fill: #ffedd5; stroke: #f6821f; }
    .svc { fill: #ffffff; stroke: #d0d7de; }
    .ext { fill: #ffffff; stroke: #9ec0f7; }
    .a { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .cron { stroke: #57606a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .b { fill: #f6821f; }
    .bn { fill: #ffffff; font-size: 11px; font-weight: 700; }
    .l { fill: #1f2328; font-size: 11px; stroke: #ffffff; stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; }
    .head { fill: #57606a; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="840" height="560" rx="12"/>

  <!-- Zones -->
  <rect class="cfz" x="280" y="20" width="540" height="520" rx="14" stroke-width="1.5"/>
  <text class="zl cfl" x="298" y="43">CLOUDFLARE · WORKERS FREE PLAN</text>
  <rect class="gz" x="20" y="190" width="190" height="250" rx="14" stroke-width="1.5"/>
  <text class="zl gl" x="36" y="212">GOOGLE</text>

  <!-- Browser -->
  <rect class="svc" x="30" y="70" width="170" height="80" rx="10" stroke-width="1.5"/>
  <text class="t" x="115" y="105" text-anchor="middle">Browser</text>
  <text class="s" x="115" y="123" text-anchor="middle">React SPA · resizes images</text>

  <!-- Google -->
  <rect class="ext" x="35" y="225" width="160" height="55" rx="10" stroke-width="1.5"/>
  <text class="t" x="115" y="249" text-anchor="middle">Sign-in</text>
  <text class="s" x="115" y="266" text-anchor="middle">OIDC + PKCE</text>
  <rect class="ext" x="35" y="320" width="160" height="100" rx="10" stroke-width="1.5"/>
  <text class="t" x="115" y="358" text-anchor="middle">Google Drive</text>
  <text class="s" x="115" y="376" text-anchor="middle">Expense Receipts/</text>
  <text class="s" x="115" y="392" text-anchor="middle">drive.file · write-once</text>

  <!-- Worker handlers -->
  <rect class="h" x="310" y="70" width="190" height="80" rx="10" stroke-width="1.5"/>
  <text class="tag" x="405" y="94" text-anchor="middle">WORKER</text>
  <text class="t" x="405" y="114" text-anchor="middle">fetch</text>
  <text class="s" x="405" y="132" text-anchor="middle">Hono API + static SPA</text>

  <rect class="h" x="310" y="330" width="190" height="80" rx="10" stroke-width="1.5"/>
  <text class="tag" x="405" y="354" text-anchor="middle">WORKER</text>
  <text class="t" x="405" y="374" text-anchor="middle">queue</text>
  <text class="s" x="405" y="392" text-anchor="middle">extraction agent + Zod</text>

  <rect class="h" x="590" y="205" width="190" height="70" rx="10" stroke-width="1.5"/>
  <text class="tag" x="685" y="226" text-anchor="middle">WORKER</text>
  <text class="t" x="685" y="245" text-anchor="middle">scheduled</text>
  <text class="s" x="685" y="262" text-anchor="middle">00:05 UTC · re-send parked</text>

  <!-- Cloudflare services -->
  <rect class="svc" x="310" y="215" width="190" height="50" rx="25" stroke-width="1.5"/>
  <text class="t" x="405" y="237" text-anchor="middle">RECEIPT_QUEUE</text>
  <text class="s" x="405" y="253" text-anchor="middle">Queues + DLQ</text>

  <rect class="svc" x="590" y="330" width="190" height="80" rx="10" stroke-width="1.5"/>
  <text class="t" x="685" y="364" text-anchor="middle">Workers AI</text>
  <text class="s" x="685" y="382" text-anchor="middle">Llama 3.2 Vision · toMarkdown</text>

  <rect class="svc" x="590" y="450" width="190" height="70" rx="10" stroke-width="1.5"/>
  <text class="t" x="685" y="480" text-anchor="middle">D1</text>
  <text class="s" x="685" y="498" text-anchor="middle">ledger · receipts · ai_usage</text>

  <!-- Arrows -->
  <line class="a" x1="115" y1="150" x2="115" y2="223" marker-end="url(#arr)"/>
  <line class="a" x1="200" y1="110" x2="308" y2="110" marker-end="url(#arr)"/>
  <line class="a" x1="310" y1="140" x2="197" y2="328" marker-end="url(#arr)"/>
  <line class="a" x1="405" y1="150" x2="405" y2="213" marker-end="url(#arr)"/>
  <line class="a" x1="405" y1="265" x2="405" y2="328" marker-end="url(#arr)"/>
  <line class="a" x1="310" y1="370" x2="197" y2="370" marker-end="url(#arr)"/>
  <line class="a" x1="500" y1="370" x2="588" y2="370" marker-end="url(#arr)"/>
  <line class="a" x1="500" y1="395" x2="588" y2="477" marker-end="url(#arr)"/>
  <path class="a" d="M502 95 H802 V485 H782" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line class="cron" x1="590" y1="240" x2="502" y2="240" marker-end="url(#arr)"/>

  <!-- Labels -->
  <text class="l" x="130" y="191">sign in</text>
  <text class="l" x="255" y="97" text-anchor="middle">upload</text>
  <text class="l" x="266" y="232">save</text>
  <text class="l" x="420" y="186">enqueue</text>
  <text class="l" x="420" y="301">deliver · batch of 1</text>
  <text class="l" x="252" y="357" text-anchor="middle">download</text>
  <text class="l" x="545" y="357" text-anchor="middle">extract</text>
  <text class="l" x="560" y="430">write entry</text>
  <text class="l" x="652" y="82" text-anchor="middle">poll status · read &amp; edit ledger</text>

  <!-- Step badges -->
  <g><circle class="b" cx="115" cy="187" r="10"/><text class="bn" x="115" y="191" text-anchor="middle">1</text></g>
  <g><circle class="b" cx="255" cy="110" r="10"/><text class="bn" x="255" y="114" text-anchor="middle">2</text></g>
  <g><circle class="b" cx="253" cy="235" r="10"/><text class="bn" x="253" y="239" text-anchor="middle">3</text></g>
  <g><circle class="b" cx="405" cy="182" r="10"/><text class="bn" x="405" y="186" text-anchor="middle">4</text></g>
  <g><circle class="b" cx="405" cy="297" r="10"/><text class="bn" x="405" y="301" text-anchor="middle">5</text></g>
  <g><circle class="b" cx="252" cy="370" r="10"/><text class="bn" x="252" y="374" text-anchor="middle">6</text></g>
  <g><circle class="b" cx="545" cy="370" r="10"/><text class="bn" x="545" y="374" text-anchor="middle">7</text></g>
  <g><circle class="b" cx="545" cy="436" r="10"/><text class="bn" x="545" y="440" text-anchor="middle">8</text></g>
  <g><circle class="b" cx="652" cy="95" r="10"/><text class="bn" x="652" y="99" text-anchor="middle">9</text></g>

  <!-- Legend -->
  <rect class="h" x="24" y="470" width="16" height="12" rx="3" stroke-width="1.2"/>
  <text class="s" x="48" y="480">Worker handler (one script)</text>
  <rect class="svc" x="24" y="492" width="16" height="12" rx="3" stroke-width="1.2"/>
  <text class="s" x="48" y="502">Cloudflare binding</text>
  <line class="cron" x1="24" y1="520" x2="40" y2="520"/>
  <text class="s" x="48" y="524">daily Cron Trigger</text>
</svg>
