# CI checks -> build -> D1 migrations -> Pulumi services.
#   staging:    every merge (push) to main, or a manual run on main
#   production: publishing a GitHub release whose tag is v* and points at a commit on main
#               (prereleases are skipped). Roll back by re-running an older release's run.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PULUMI_ACCESS_TOKEN as environment secrets
# on the staging and production environments, and the services stack config per env
# (see infrastructure/README.md).
name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # No always()/failure() in `if`, so a failed or cancelled CI run skips the deploy.
  deploy:
    needs: ci
    if: >-
      (github.event_name == 'release'
        && startsWith(github.event.release.tag_name, 'v')
        && !github.event.release.prerelease)
      || (github.event_name != 'release' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are set only on the steps that need them, so `pnpm install` and the build
    # (third-party code) never see the Cloudflare or Pulumi tokens.
    env:
      STACK: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    environment:
      name: ${{ github.event_name == 'release' && 'production' || 'staging' }}
      url: ${{ steps.pulumi.outputs.appOrigin }}
    # Queue deploys per env; never cancel one mid-migration or mid-`pulumi up`.
    concurrency:
      group: deploy-${{ github.event_name == 'release' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release must be on main
        if: github.event_name == 'release'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Release tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter web build
          pnpm --filter worker bundle

      # Additive-only migrations run before the new code goes live.
      - name: Migrate D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter worker exec wrangler d1 migrations apply "expense-$STACK" --env "$STACK" --remote

      - name: Deploy services
        id: pulumi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: up
          stack-name: seelowbei/${{ env.STACK }}
          work-dir: infrastructure/services
