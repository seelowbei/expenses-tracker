# Typecheck and test on every push and PR. No deploy, no secrets.
# Deployment (deploy.yml: Pulumi services -> staging/production) comes in M5.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (worker + infrastructure)
        run: pnpm -r typecheck

      - name: Test with coverage
        run: pnpm --filter worker coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worker-coverage
          path: worker/coverage/
          retention-days: 14
