# Typecheck and test on every PR. No deploy, no secrets.
# Pushes to main and published releases run this via deploy.yml (workflow_call) before deploying.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check on main (branch protection). Renaming it means
  # updating the required check in the same change, or every PR waits forever.
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (worker + infrastructure)
        run: pnpm -r typecheck

      - name: Agent hook tests
        run: pnpm test:hooks

      - name: Test with coverage
        run: pnpm --filter worker coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: worker-coverage
          path: worker/coverage/
          retention-days: 14
